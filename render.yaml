services:
  - type: web
    name: railnova-web-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false # Set via Render Dashboard e.g. jdbc:mysql://<host>:3306/<database>?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false # Set via Render Dashboard
      - key: DB_PASSWORD
        sync: false # Set via Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_KEY_ID
        value: rzp_test_railnova_sandbox_key
      - key: PAYMENT_KEY_SECRET
        generateValue: true
