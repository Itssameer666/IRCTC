server.port=${PORT:8080}
spring.application.name=railnova-backend

# Default Datasource (H2 in MySQL mode for instant out-of-the-box local development & testing)
spring.datasource.url=${DB_URL:jdbc:h2:mem:railnova_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging, disabled in prod)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
railnova.jwt.secret=${JWT_SECRET:RailNovaSuperSecureSecretKeyWithMinimum256BitsRequiredForHS256Signature2026}
railnova.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Payment Gateway Sandbox Configuration (Official Razorpay-style architectural flow)
railnova.payment.key-id=${PAYMENT_KEY_ID:rzp_test_railnova_sandbox_key}
railnova.payment.key-secret=${PAYMENT_KEY_SECRET:railnova_secret_sandbox_signature_key_2026}
railnova.payment.currency=INR

# Swagger OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging
logging.level.com.railnova=INFO
logging.level.org.springframework.web=INFO
